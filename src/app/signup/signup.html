<section class="signup-section">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="signup-card shadow-sm rounded-4 p-4 p-md-5">
          <div class="text-center mb-4">
            <span class="badge text-bg-primary mb-3">Create account</span>
            <h2 class="mb-2">Sign Up</h2>
            <p class="text-secondary mb-0">Join us and start building your next big idea.</p>
          </div>

          <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" novalidate>
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input
                type="text"
                class="form-control form-control-lg"
                formControlName="fullName"
                [ngClass]="{ 'is-invalid': fullName?.invalid && fullName?.touched }"
                placeholder="Enter your name"
              />
              <div class="invalid-feedback" *ngIf="fullName?.touched && fullName?.errors">
                <span *ngIf="fullName?.errors?.['required']">Full name is required.</span>
                <span *ngIf="fullName?.errors?.['minlength']">Minimum 3 characters required.</span>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Email address</label>
              <input
                type="email"
                class="form-control form-control-lg"
                formControlName="email"
                [ngClass]="{ 'is-invalid': email?.invalid && email?.touched }"
                placeholder="Enter your email"
              />
              <div class="invalid-feedback" *ngIf="email?.touched && email?.errors">
                <span *ngIf="email?.errors?.['required']">Email is required.</span>
                <span *ngIf="email?.errors?.['email']">Enter a valid email.</span>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input
                type="password"
                class="form-control form-control-lg"
                formControlName="password"
                [ngClass]="{ 'is-invalid': password?.invalid && password?.touched }"
                placeholder="Create a password"
              />
              <div class="invalid-feedback" *ngIf="password?.touched && password?.errors">
                <span *ngIf="password?.errors?.['required']">Password is required.</span>
                <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters.</span>
              </div>
            </div>

            <div class="mb-4 form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="termsCheck"
                formControlName="terms"
                [ngClass]="{ 'is-invalid': terms?.invalid && terms?.touched }"
              />
              <label class="form-check-label text-secondary" for="termsCheck">
                I agree to the terms and conditions
              </label>
              <div class="invalid-feedback d-block" *ngIf="terms?.touched && terms?.errors?.['required']">
                You must agree before continuing.
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100">Sign Up</button>

            <p class="text-center text-secondary mt-3 mb-0">
              Already have an account?
              <a routerLink="/login" class="text-primary text-decoration-none">Login</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
